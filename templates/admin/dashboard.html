{% extends "base.html" %}
{% block title %}Админ-панель{% endblock %}
{% block content %}
<h1 class="mb-4">Админ-панель</h1>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card p-3"><h5>Пользователи</h5><p class="display-6">{{ nu }}</p></div></div>
  <div class="col-md-4"><div class="card p-3"><h5>Посты</h5><p class="display-6">{{ np }}</p></div></div>
  <div class="col-md-4"><div class="card p-3"><h5>Комментарии</h5><p class="display-6">{{ nc }}</p></div></div>
</div>
<p class="d-flex flex-wrap gap-2">
  <a href="{{ url_for('admin_users') }}" class="btn btn-primary">Пользователи</a>
  <a href="{{ url_for('admin_posts') }}" class="btn btn-outline-primary">Посты</a>
  {% if is_admin() %}
  <a href="{{ url_for('admin_mutes') }}" class="btn btn-outline-danger">Муты (мат)</a>
  <a href="{{ url_for('admin_topics') }}" class="btn btn-outline-warning">Темы</a>
  {% endif %}
</p>
{% endblock %}
